<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC — cosmic.fm</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(ellipse at bottom, #0f172a 0%, #020617 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #stars-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      display: flex;
      height: calc(100vh - 90px);
      z-index: 1;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(15px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #c084fc;
      text-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-btn:hover, .menu-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      padding: 30px 40px;
      overflow-y: auto;
    }

    .search-box {
      width: 100%;
      max-width: 420px;
      padding: 12px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      outline: none;
      transition: all 0.3s;
    }

    .search-box:focus {
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .song-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-4px);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 12px;
      background: #1e293b;
    }

    .song-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Player Bar */
    .player-bar {
      height: 90px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 10;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 280px;
    }

    .now-playing img {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      background: #1e293b;
      object-fit: cover;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 500px;
    }

    .control-btns {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-action {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .btn-action:hover {
      color: #fff;
    }

    .btn-play {
      background: #a855f7;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-play:hover {
      transform: scale(1.05);
      background: #c084fc;
    }

    .extra-controls {
      width: 280px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-lyrics {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #c084fc;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-lyrics:hover {
      background: rgba(192, 132, 252, 0.15);
      border-color: #c084fc;
    }
  </style>
</head>
<body>

  <!-- Starfield Canvas Background -->
  <canvas id="stars-bg"></canvas>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">COSMIC</div>
      <div class="nav-group">
        <button class="menu-btn active">Home</button>
        <button class="menu-btn">Discover</button>
        <button class="menu-btn">Your Library</button>
        <button class="menu-btn">Playlists</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <input type="text" class="search-box" placeholder="Search tracks, artists, or albums..." id="search-input">
      
      <h2 class="section-title">Recommended Tracks</h2>
      <div class="song-grid" id="song-list">
        <!-- Tracks rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Bottom Audio Player Bar -->
  <div class="player-bar">
    <div class="now-playing">
      <img id="current-cover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="">
      <div>
        <div id="current-title" class="song-title">No track selected</div>
        <div id="current-artist" class="song-artist">Select a track to play</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-btns">
        <button class="btn-action">PREV</button>
        <button class="btn-play" id="play-btn" onclick="togglePlay()">PLAY</button>
        <button class="btn-action">NEXT</button>
      </div>
    </div>

    <div class="extra-controls">
      <button class="btn-lyrics">LYRICS</button>
    </div>
  </div>

  <div id="yt-player" style="display:none;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Initial Track Data
    const songs = [
      { id: 'fJ9rUzIMcZQ', title: 'Bohemian Rhapsody', artist: 'Queen', cover: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg' },
      { id: 'hT_nvWreI6o', title: 'Counting Stars', artist: 'OneRepublic', cover: 'https://img.youtube.com/vi/hT_nvWreI6o/hqdefault.jpg' },
      { id: '3YxaaGgTQYM', title: 'A Sky Full of Stars', artist: 'Coldplay', cover: 'https://img.youtube.com/vi/3YxaaGgTQYM/hqdefault.jpg' },
      { id: 'L_LUpnjgPso', title: 'Starboy', artist: 'The Weeknd', cover: 'https://img.youtube.com/vi/L_LUpnjgPso/hqdefault.jpg' }
    ];

    const container = document.getElementById('song-list');
    songs.forEach(song => {
      container.innerHTML += `
        <div class="song-card" onclick="userSelectSong('${song.id}', '${song.title}', '${song.artist}', '${song.cover}')">
          <img class="card-img" src="${song.cover}">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
      `;
    });

    // Starfield Animation Canvas
    const canvas = document.getElementById('stars-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for(let i = 0; i < 140; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.6,
        alpha: Math.random(),
        speed: 0.005 + Math.random() * 0.01
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.alpha += s.speed;
        if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
      });
      requestAnimationFrame(render);
    }
    render();

    // YouTube Audio Player Engine
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', { height: '0', width: '0' });
    }

    function userSelectSong(id, title, artist, cover) {
      document.getElementById('current-title').innerText = title;
      document.getElementById('current-artist').innerText = artist;
      document.getElementById('current-cover').src = cover;
      
      if(player) {
        player.loadVideoById(id);
        document.getElementById('play-btn').innerText = 'PAUSE';
      }
    }

    function togglePlay() {
      if(!player || !player.getVideoData().video_id) return;
      if(player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        document.getElementById('play-btn').innerText = 'PLAY';
      } else {
        player.playVideo();
        document.getElementById('play-btn').innerText = 'PAUSE';
      }
    }
  </script>
</body>
</html>
