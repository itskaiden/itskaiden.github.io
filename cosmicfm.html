<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC.FM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: radial-gradient(ellipse at bottom, #0f172a 0%, #020617 100%); color: #fff; height: 100vh; overflow: hidden; }
    
    #stars-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
    .app-container { display: flex; height: calc(100vh - 90px); z-index: 1; position: relative; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border-right: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .brand { font-size: 1.5rem; font-weight: bold; color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.5); }
    .menu-btn { background: none; border: none; color: #94a3b8; font-size: 1rem; text-align: left; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .menu-btn:hover, .menu-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; }

    /* Main Area */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .search-box { width: 100%; max-width: 400px; padding: 12px 20px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); color: #fff; margin-bottom: 25px; backdrop-filter: blur(10px); outline: none; }
    .search-box:focus { border-color: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }

    .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .song-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.3s; }
    .song-card:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-5px); }
    .card-img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; margin-bottom: 10px; }

    /* Bottom Player Bar (Idle sampai diklik) */
    .player-bar { height: 90px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; bottom: 0; width: 100%; z-index: 10; }
    .now-playing { display: flex; align-items: center; gap: 15px; width: 250px; }
    .now-playing img { width: 50px; height: 50px; border-radius: 6px; background: #1e293b; }
    .btn-play { background: #a855f7; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>

  <canvas id="stars-bg"></canvas>

  <div class="app-container">
    <div class="sidebar">
      <div class="brand">COSMIC</div>
      <button class="menu-btn active">Beranda</button>
      <button class="menu-btn">Playlist Saya</button>
      <button class="menu-btn">Lirik</button>
    </div>

    <div class="main-content">
      <input type="text" class="search-box" placeholder="🔍 Cari lagu atau penyanyi..." id="search-input">
      
      <h2 style="margin-bottom: 15px;">Rekomendasi Musik</h2>
      <div class="song-grid" id="song-list">
        <!-- Lagu cuma bakal muter KALAU DIKLIK sama lu -->
      </div>
    </div>
  </div>

  <!-- Player Bar (Default: Mati / Belum Muter Apa-apa) -->
  <div class="player-bar">
    <div class="now-playing">
      <img id="current-cover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="">
      <div>
        <div id="current-title" style="font-weight:600;">Belum ada lagu</div>
        <div id="current-artist" style="font-size:0.8rem; color:#94a3b8;">Pilih lagu untuk memutar</div>
      </div>
    </div>

    <div>
      <button class="btn-play" id="play-btn" onclick="togglePlay()">▶</button>
    </div>

    <div style="width: 250px; text-align: right; color:#a855f7; cursor:pointer;">Lirik</div>
  </div>

  <div id="yt-player" style="display:none;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Data Daftar Lagu (Tergantung Pilihan User)
    const songs = [
      { id: 'fJ9rUzIMcZQ', title: 'Bohemian Rhapsody', artist: 'Queen', cover: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg' },
      { id: 'hT_nvWreI6o', title: 'Counting Stars', artist: 'OneRepublic', cover: 'https://img.youtube.com/vi/hT_nvWreI6o/hqdefault.jpg' },
      { id: '3YxaaGgTQYM', title: 'A Sky Full of Stars', artist: 'Coldplay', cover: 'https://img.youtube.com/vi/3YxaaGgTQYM/hqdefault.jpg' }
    ];

    const container = document.getElementById('song-list');
    songs.forEach(song => {
      container.innerHTML += `
        <div class="song-card" onclick="userSelectSong('${song.id}', '${song.title}', '${song.artist}', '${song.cover}')">
          <img class="card-img" src="${song.cover}">
          <div style="font-weight:600;">${song.title}</div>
          <div style="font-size:0.85rem; color:#94a3b8;">${song.artist}</div>
        </div>
      `;
    });

    // Bintang-Bintang Canvas
    const canvas = document.getElementById('stars-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for(let i=0; i<120; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, size:Math.random()*1.8, alpha:Math.random(), speed:0.01});
    function render() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
        s.alpha += s.speed; if(s.alpha>1||s.alpha<0) s.speed = -s.speed;
      });
      requestAnimationFrame(render);
    }
    render();

    // YouTube Audio Player (TIDAK AUTOPLAY - HANYA RESPON KLIK USER)
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', { height: '0', width: '0' });
    }

    // Fungsi MURNI DARI KLIK USER
    function userSelectSong(id, title, artist, cover) {
      document.getElementById('current-title').innerText = title;
      document.getElementById('current-artist').innerText = artist;
      document.getElementById('current-cover').src = cover;
      
      if(player) {
        player.loadVideoById(id); // Baru muter pas diklik
        document.getElementById('play-btn').innerText = '⏸';
      }
    }

    function togglePlay() {
      if(!player || !player.getVideoData().video_id) return; // Ga jalan kalau belum ada lagu yang dipilih
      if(player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        document.getElementById('play-btn').innerText = '▶';
      } else {
        player.playVideo();
        document.getElementById('play-btn').innerText = '⏸';
      }
    }
  </script>
</body>
</html>
