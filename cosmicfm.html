<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC — cosmic.fm</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(ellipse at bottom, #0a0d14 0%, #020305 100%);
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Starfield Canvas Background */
    #stars-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 80px);
      z-index: 1;
      position: relative;
    }

    /* Sidebar (Desktop Only) */
    .sidebar {
      width: 220px;
      background: rgba(10, 13, 20, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #8a8d93;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .menu-btn:hover, .menu-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      width: 100%;
    }

    .mobile-header {
      display: none;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 12px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.85rem;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
      outline: none;
      transition: all 0.2s;
    }

    .search-box:focus {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #e2e8f0;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding-bottom: 20px;
    }

    .song-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-3px);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      object-fit: cover;
      margin-bottom: 10px;
      background: #11141d;
    }

    .song-title {
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .song-artist {
      font-size: 0.75rem;
      color: #8a8d93;
      margin-top: 3px;
    }

    /* Player Bar Clean Monochrome */
    .player-bar {
      height: 80px;
      background: rgba(8, 10, 15, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 10;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .now-playing img {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      background: #11141d;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info {
      min-width: 0;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn-action {
      background: none;
      border: none;
      color: #8a8d93;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px;
    }

    .btn-play {
      background: #ffffff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #000000;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-lyrics {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Responsive untuk Mobile (HP) */
    @media (max-width: 768px) {
      .sidebar {
        display: none; /* Sembunyikan sidebar di HP */
      }

      .mobile-header {
        display: block; /* Munculkan logo di atas */
      }

      .main-content {
        padding: 16px;
      }

      .song-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 12px;
      }

      .btn-action {
        display: none; /* Sembunyikan prev/next biar gak sempit di HP */
      }

      .player-bar {
        height: 70px;
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>

  <canvas id="stars-bg"></canvas>

  <div class="app-container">
    <!-- Desktop Sidebar -->
    <div class="sidebar">
      <div class="brand">COSMIC</div>
      <div class="nav-group">
        <button class="menu-btn active">Home</button>
        <button class="menu-btn">Discover</button>
        <button class="menu-btn">Your Library</button>
        <button class="menu-btn">Playlists</button>
      </div>
    </div>

    <!-- Main Area -->
    <div class="main-content">
      <div class="mobile-header">COSMIC</div>
      <input type="text" class="search-box" placeholder="Search tracks or artists..." id="search-input">
      
      <h2 class="section-title">Recommended Tracks</h2>
      <div class="song-grid" id="song-list"></div>
    </div>
  </div>

  <!-- Player Bar Clean Monochrome -->
  <div class="player-bar">
    <div class="now-playing">
      <img id="current-cover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="">
      <div class="track-info">
        <div id="current-title" class="song-title">No track selected</div>
        <div id="current-artist" class="song-artist">Select a track to play</div>
      </div>
    </div>

    <div class="player-controls">
      <button class="btn-action">PREV</button>
      <button class="btn-play" id="play-btn" onclick="togglePlay()">PLAY</button>
      <button class="btn-action">NEXT</button>
      <button class="btn-lyrics">LYRICS</button>
    </div>
  </div>

  <div id="yt-player" style="display:none;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const songs = [
      { id: 'fJ9rUzIMcZQ', title: 'Bohemian Rhapsody', artist: 'Queen', cover: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg' },
      { id: 'hT_nvWreI6o', title: 'Counting Stars', artist: 'OneRepublic', cover: 'https://img.youtube.com/vi/hT_nvWreI6o/hqdefault.jpg' },
      { id: '3YxaaGgTQYM', title: 'A Sky Full of Stars', artist: 'Coldplay', cover: 'https://img.youtube.com/vi/3YxaaGgTQYM/hqdefault.jpg' },
      { id: 'L_LUpnjgPso', title: 'Starboy', artist: 'The Weeknd', cover: 'https://img.youtube.com/vi/L_LUpnjgPso/hqdefault.jpg' }
    ];

    const container = document.getElementById('song-list');
    songs.forEach(song => {
      container.innerHTML += `
        <div class="song-card" onclick="userSelectSong('${song.id}', '${song.title}', '${song.artist}', '${song.cover}')">
          <img class="card-img" src="${song.cover}">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
      `;
    });

    // Starfield Background
    const canvas = document.getElementById('stars-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for(let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5,
        alpha: Math.random(),
        speed: 0.005 + Math.random() * 0.01
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.alpha += s.speed;
        if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
      });
      requestAnimationFrame(render);
    }
    render();

    // Player Engine
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', { height: '0', width: '0' });
    }

    function userSelectSong(id, title, artist, cover) {
      document.getElementById('current-title').innerText = title;
      document.getElementById('current-artist').innerText = artist;
      document.getElementById('current-cover').src = cover;
      
      if(player) {
        player.loadVideoById(id);
        document.getElementById('play-btn').innerText = 'PAUSE';
      }
    }

    function togglePlay() {
      if(!player || !player.getVideoData().video_id) return;
      if(player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        document.getElementById('play-btn').innerText = 'PLAY';
      } else {
        player.playVideo();
        document.getElementById('play-btn').innerText = 'PAUSE';
      }
    }
  </script>
</body>
</html>
