<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC.fm</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Bintang-bintang pake Canvas */
    #stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Player Container */
    .player-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      width: 350px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .album-art {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(121, 40, 202, 0.5);
      animation: spin 20s linear infinite;
      animation-play-state: paused;
    }

    .album-art.playing {
      animation-play-state: running;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .artist {
      font-size: 0.9rem;
      color: #a0a0c0;
      margin-bottom: 25px;
    }

    .controls button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    /* Iframe disembunyikan biar cuma kedengeran suaranya */
    #yt-player {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Canvas Bintang -->
  <canvas id="stars"></canvas>

  <!-- Player UI -->
  <div class="player-card">
    <div class="album-art" id="art">✨</div>
    <div class="song-title" id="title">Galaxy Song</div>
    <div class="artist" id="artist">Streaming via YouTube API</div>

    <div class="controls">
      <button id="play-btn">Play</button>
    </div>
  </div>

  <!-- Hidden YouTube Player -->
  <div id="yt-player"></div>

  <script>
    // 1. Script Animasi Bintang (Canvas)
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        alpha: Math.random(),
        speed: Math.random() * 0.02
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();

        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) {
          star.speed = -star.speed;
        }
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // 2. YouTube Player API Setup
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        videoId: 'fJ9rUzIMcZQ', // Contoh ID Video YouTube (Bohemian Rhapsody)
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    const playBtn = document.getElementById('play-btn');
    const albumArt = document.getElementById('art');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.innerText = 'Pause';
        albumArt.classList.add('playing');
      } else {
        isPlaying = false;
        playBtn.innerText = 'Play';
        albumArt.classList.remove('playing');
      }
    }
  </script>
</body>
</html>
