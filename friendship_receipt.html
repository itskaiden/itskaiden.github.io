<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Custom Receipt Generator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --receipt-paper-color: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #121214;
            color: #fff;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* --- CONTROL PANEL --- */
        .control-panel {
            background: #1e1e24; padding: 25px; border-radius: 16px;
            width: 100%; max-width: 440px; box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px;
        }
        .control-panel h2 { margin: 0 0 20px 0; font-size: 1.3rem; text-align: center; font-weight: 800; color: #fff; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; color: #a1a1aa; }
        .form-group input {
            width: 100%; padding: 11px; border: 1px solid #3f3f46;
            background: #27272a; color: #fff; border-radius: 8px; box-sizing: border-box; font-family: inherit; outline: none;
        }
        .form-group input:focus { border-color: #00ff66; }

        /* Color Picker Styling */
        .color-picker-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            background: #27272a; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3f3f46;
        }
        .color-picker-btn {
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            width: 40px; height: 40px; background: none; border: none; cursor: pointer; padding: 0;
        }
        .color-picker-btn::-webkit-color-swatch { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,0,0,0.3); }

        .btn-action {
            width: 100%; padding: 13px; background: #00ff66; border: none;
            color: #000; font-weight: 700; border-radius: 8px; cursor: pointer;
            transition: 0.2s; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;
        }
        .btn-action:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(0,255,102,0.3); }

        /* --- ADVANCED EMOJI SEARCH DRAWER --- */
        .sticker-drawer {
            display: none; background: #1e1e24; border-radius: 12px; padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px; width: 100%; max-width: 440px; box-sizing: border-box;
        }
        .search-emoji-input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3f3f46;
            background: #27272a; color: #fff; margin-bottom: 12px; outline: none; box-sizing: border-box;
        }
        .emoji-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
            max-height: 180px; overflow-y: auto; font-size: 1.8rem; text-align: center; padding-right: 5px;
        }
        .emoji-item { cursor: pointer; transition: transform 0.1s; user-select: none; }
        .emoji-item:hover { transform: scale(1.2); }

        /* --- WORKSPACE VIEW --- */
        .workspace {
            display: none; width: 100%; max-width: 480px; position: relative;
        }
        
        /* Area Pratinjau di Browser (Tetap pakai background gelap biar keliatan kontras struknya) */
        .capture-area {
            padding: 60px 40px; position: relative; background: #121214;
        }

        /* Penjepit Atas */
        .binder-clip {
            width: 95px; position: absolute; top: 22px; left: 50%;
            transform: translateX(-50%); z-index: 10; filter: drop-shadow(0 5px 6px rgba(0,0,0,0.3));
        }

        /* STRUK UTAMA - TARGET DOWNLOAD UTAMA */
        .receipt {
            background: var(--receipt-paper-color); color: #111111; padding: 55px 28px 30px 28px;
            font-family: 'Courier Prime', monospace; font-size: 0.85rem;
            box-shadow: 0 20px 45px rgba(0,0,0,0.3); text-align: left;
            position: relative; border-radius: 2px; transition: background-color 0.2s ease;
            box-sizing: border-box; width: 100%;
        }

        /* CONTAINER FOTO */
        .receipt-image-container {
            width: 100%; height: 210px; margin: 12px 0; overflow: hidden; border-radius: 2px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .receipt-image {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .divider { border-top: 1px dashed #111; margin: 12px 0; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 5px; line-height: 1.3; }
        .receipt-row.total { font-weight: bold; font-size: 0.95rem; border-top: 1px dashed #111; padding-top: 8px; margin-top: 10px; }
        .footer-text { text-align: center; font-size: 0.7rem; margin-top: 25px; line-height: 1.4; }

        /* --- LIVE STICKERS SYSTEM --- */
        .placed-sticker {
            position: absolute; font-size: 2.8rem; cursor: move;
            display: inline-block; touch-action: none; z-index: 100; padding: 4px;
        }
        .placed-sticker:hover { border: 1px dashed rgba(0,0,0,0.3); border-radius: 4px; }
        .sticker-controls {
            display: none; position: absolute; top: -18px; left: 50%;
            transform: translateX(-50%); gap: 4px; background: #fff;
            padding: 2px 4px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .placed-sticker:hover .sticker-controls { display: flex; }
        .ctrl-btn {
            font-size: 0.65rem; cursor: pointer; padding: 2px 5px; font-family: sans-serif;
            background: #f4f4f5; border-radius: 4px; border: 1px solid #d4d4d8; color: #000; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="control-panel" id="inputForm">
        <h2>🧾 Receipt Customizer</h2>
        
        <div class="color-picker-wrapper">
            <label>CHOOSE RECEIPT PAPER COLOR:</label>
            <input type="color" id="paperPicker" class="color-picker-btn" value="#ffffff" oninput="changePaperColor(this.value)">
        </div>

        <div class="form-group"><label>Your Name</label><input type="text" id="fullName" placeholder="KAIDEN EINSTEIN"></div>
        <div class="form-group"><label>Your Nickname</label><input type="text" id="nickname" placeholder="KAI"></div>
        <div class="form-group"><label>Favorite Track</label><input type="text" id="favSong" placeholder="GOYANG DUMANG - CITA CITATA"></div>
        <div class="form-group"><label>Current Mood</label><input type="text" id="currentMood" placeholder="MANTAP"></div>
        <div class="form-group"><label>Signature Phrase</label><input type="text" id="signaturePhrase" placeholder="YAELAAAAH"></div>
        <div class="form-group"><label>Upload Photo</label><input type="file" id="favPhoto" accept="image/*"></div>
        
        <button class="btn-action" onclick="generateReceipt()">Print Receipt ➔</button>
    </div>

    <div class="sticker-drawer" id="stickerDrawer">
        <input type="text" id="emojiSearch" class="search-emoji-input" placeholder="🔍 Search emoji... (e.g., cat, fire, heart)" oninput="filterEmojis(this.value)">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="workspace" id="receiptWrapper">
        <div class="capture-area" id="captureArea">
            <!-- Penjepit Besi dipindah ke dalam kertas .receipt agar ikut terbawa tanpa background hitam -->
            <div class="receipt" id="mainReceipt">
                <svg class="binder-clip" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="25" y="25" width="50" height="30" rx="3" fill="#2d2d30"/>
                    <circle cx="50" cy="40" r="4" fill="#fff"/>
                    <path d="M35 25C35 10 65 10 65 25" stroke="#a1a1aa" stroke-width="3" fill="none"/>
                </svg>

                <div class="receipt-header">
                    <h1 style="margin:0 0 4px 0; font-size:1.4rem; letter-spacing:1px;">RECEIPTIFY</h1>
                    <div id="receiptDate">THURSDAY, AUGUST 7, 2025</div>
                    <div>ORDER #0001 FOR TWILULIT</div>
                </div>

                <div class="receipt-image-container" id="imgContainer" style="display:none;">
                    <img id="outputImage" class="receipt-image" src="" alt="Fav Moment">
                </div>
                
                <div class="divider"></div>
                <div class="receipt-row"><span>QTY   ITEM</span><span>AMT</span></div>
                <div class="divider"></div>

                <div class="receipt-row"><span id="outName">01   NAME: GUEST</span><span>100%</span></div>
                <div class="receipt-row"><span id="outNickname">01   AKA: STRANGER</span><span>100%</span></div>
                <div class="receipt-row"><span id="outSong">01   TRACK: NONE</span><span>100%</span></div>
                <div class="receipt-row"><span id="outMood">01   MOOD: MELLOW</span><span>100%</span></div>
                <div class="receipt-row"><span id="outPhrase">01   SAYS: ""</span><span>100%</span></div>
                
                <div class="divider"></div>
                <div class="receipt-row"><span>ITEM COUNT:</span><span>5 ITEMS</span></div>
                <div class="receipt-row total"><span>TOTAL RELATIONSHIP:</span><span>999+</span></div>

                <div class="footer-text">
                    THANK YOU FOR VISITING!<br>
                    { itskaiden.github.io }
                </div>
            </div>
        </div>
        
        <button class="btn-action" style="background:#00e676; margin-bottom:8px; color:#000;" onclick="toggleStickerDrawer()">＋ Add Sticker / Search Emoji</button>
        <button class="btn-action" style="background:#fff; color:#000; margin-bottom:8px;" onclick="downloadReceipt()">Save Image 💾</button>
        <button class="btn-action" style="background:transparent; color:#fff; border:1px solid #fff;" onclick="resetForm()">Create New ↺</button>
    </div>

    <script>
        const emojiDatabase = [
            {char: "✨", tags: "sparkles shine gold premium"}, {char: "💖", tags: "heart love pink glossy"},
            {char: "😭", tags: "cry sad tear face"}, {char: "💀", tags: "skull dead bone death"},
            {char: "🔥", tags: "fire hot flame burn"}, {char: "🥝", tags: "kiwi fruit food green"},
            {char: "🍀", tags: "clover leaf luck green"}, {char: "🐱", tags: "cat animal pet"},
            {char: "🐙", tags: "octopus sea animal"}, {char: "🎀", tags: "ribbon bow pink cute"},
            {char: "🌟", tags: "star gold yellow shine"}, {char: "🍕", tags: "pizza food cheese fastfood"},
            {char: "🍟", tags: "fries potato food junkfood"}, {char: "🍦", tags: "icecream sweet food dessert"},
            {char: "🍒", tags: "cherry fruit food red"}, {char: "🧸", tags: "teddy bear toy cute"},
            {char: "🦋", tags: "butterfly insect fly blue"}, {char: "🎧", tags: "headphones music audio song"},
            {char: "🎨", tags: "palette paint art design"}, {char: "📸", tags: "camera photo shoot snap"},
            {char: "⚡", tags: "thunder lightning electricity"}, {char: "🪐", tags: "saturn planet space orbit"},
            {char: "🎸", tags: "guitar instrument music rock"}, {char: "👾", tags: "alien monster space invader"},
            {char: "👀", tags: "eyes look see spy"}, {char: "💅", tags: "nails makeup polish fashion"},
            {char: "🤡", tags: "clown face joke funny"}, {char: "💌", tags: "letter love card envelope"},
            {char: "🎐", tags: "wind chime japan bell"}, {char: "🥤", tags: "soda drink cup fresh"},
            {char: "🌿", tags: "leaf nature plant"}, {char: "🌌", tags: "star galaxy"},
            {char: "🐇", tags: "rabbit bunny animal"}, {char: "🐾", tags: "paws dog animal"}, 
            {char: "🧁", tags: "cupcake cake sweet"}, {char: "🍡", tags: "dango japan sweet"}, 
            {char: " donuts", tags: "donut sweet dessert"}, {char: "🥑", tags: "avocado green fruit"}, 
            {char: "🌙", tags: "moon night sleep"}, {char: "☁️", tags: "cloud weather sky"}, 
            {char: "🌈", tags: "rainbow sky color"}, {char: "🔮", tags: "magic crystal ball witch"}, 
            {char: "💰", tags: "money cash rich rich"}, {char: "🩹", tags: "bandage hurt heal"}, 
            {char: "🍷", tags: "glass drink alcohol"}, {char: "🛸", tags: "ufo space alien spaceship"}, 
            {char: "🖤", tags: "heart black dark aesthetic"}
        ];

        const grid = document.getElementById('emojiGrid');
        function renderEmojis(list) {
            grid.innerHTML = '';
            list.forEach(item => {
                let span = document.createElement('span');
                span.className = 'emoji-item';
                span.innerText = item.char;
                span.onclick = () => spawnSticker(item.char);
                grid.appendChild(span);
            });
        }
        renderEmojis(emojiDatabase);

        function filterEmojis(keyword) {
            const cleanKey = keyword.toLowerCase().trim();
            if(!cleanKey) {
                renderEmojis(emojiDatabase);
                return;
            }
            const filtered = emojiDatabase.filter(item => item.tags.includes(cleanKey));
            grid.innerHTML = '';
            filtered.forEach(item => {
                let span = document.createElement('span');
                span.className = 'emoji-item';
                span.innerText = item.char;
                span.onclick = () => spawnSticker(item.char);
                grid.appendChild(span);
            });
        }

        function changePaperColor(val) {
            document.documentElement.style.setProperty('--receipt-paper-color', val);
        }

        function toggleStickerDrawer() {
            const drawer = document.getElementById('stickerDrawer');
            drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
        }

        function generateReceipt() {
            const name = document.getElementById('fullName').value || 'Anonymous';
            const nickname = document.getElementById('nickname').value || 'Stranger';
            const song = document.getElementById('favSong').value || 'No Track';
            const mood = document.getElementById('currentMood').value || 'Normal';
            const phrase = document.getElementById('signaturePhrase').value || '';
            const photoInput = document.getElementById('favPhoto');

            document.getElementById('outName').textContent = `01   NAME: ${name.toUpperCase()}`;
            document.getElementById('outNickname').textContent = `01   AKA: ${nickname.toUpperCase()}`;
            document.getElementById('outSong').textContent = `01   TRACK: ${song.toUpperCase()}`;
            document.getElementById('outMood').textContent = `01   MOOD: ${mood.toUpperCase()}`;
            document.getElementById('outPhrase').textContent = `01   SAYS: "${phrase.toUpperCase()}"`;

            const imgContainer = document.getElementById('imgContainer');
            const outputImage = document.getElementById('outputImage');
            
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    outputImage.src = e.target.result;
                    imgContainer.style.display = 'block';
                    showWorkspace();
                }
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                imgContainer.style.display = 'none';
                showWorkspace();
            }
        }

        function showWorkspace() {
            document.getElementById('inputForm').style.display = 'none';
            document.getElementById('receiptWrapper').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('inputForm').style.display = 'block';
            document.getElementById('receiptWrapper').style.display = 'none';
            document.getElementById('stickerDrawer').style.display = 'none';
            document.getElementById('emojiSearch').value = '';
            renderEmojis(emojiDatabase);
            document.querySelectorAll('.placed-sticker').forEach(el => el.remove());
        }

        function spawnSticker(emojiText) {
            const sticker = document.createElement('div');
            sticker.className = 'placed-sticker';
            
            // Stiker ditempel langsung di dalam area koordinat kertas .receipt
            sticker.style.left = '40%';
            sticker.style.top = '150px';
            sticker.innerHTML = `
                ${emojiText}
                <div class="sticker-controls">
                    <span class="ctrl-btn" onclick="resizeSticker(this, 0.25)">＋</span>
                    <span class="ctrl-btn" onclick="resizeSticker(this, -0.25)">－</span>
                    <span class="ctrl-btn" style="color:red;" onclick="this.parentElement.parentElement.remove()">✕</span>
                </div>
            `;
            
            document.getElementById('mainReceipt').appendChild(sticker);
            makeElementDraggable(sticker);
        }

        function resizeSticker(btn, amount) {
            const sticker = btn.parentElement.parentElement;
            let currentScale = parseFloat(sticker.getAttribute('data-scale')) || 1;
            currentScale += amount;
            if (currentScale < 0.5) currentScale = 0.5;
            if (currentScale > 3) currentScale = 3;
            sticker.setAttribute('data-scale', currentScale);
            sticker.style.transform = `scale(${currentScale})`;
        }

        function makeElementDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                if(e.target.className === 'ctrl-btn') return;
                
                let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

                pos3 = clientX;
                pos4 = clientY;
                
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchmove = null;
                document.ontouchend = null;
            }
        }

        function downloadReceipt() {
            const controls = document.querySelectorAll('.sticker-controls');
            controls.forEach(c => c.style.setProperty('display', 'none', 'important'));

            // SEKARANG TARGETNYA LANGSUNG KE '#mainReceipt' BUKAN '#captureArea'
            // Biar background hitam luar ilang total!
            const element = document.getElementById('mainReceipt');
            
            html2canvas(element, {
                backgroundColor: null, // Bikin sisa background luar transparan penuh (.png)
                scale: 3,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Twilulit_Pure_Receipt.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                controls.forEach(c => c.style.removeProperty('display'));
            });
        }
    </script>
</body>
</html>
